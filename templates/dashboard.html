<!DOCTYPE html>

<html>

<head>

    <title>Demand Planning Calculator</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            font-family:'Poppins',sans-serif;
            background:#f4f7fb;
            padding:40px;
        }

        .container{
            max-width:1600px;
            margin:auto;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:20px;
            margin-bottom:30px;
            box-shadow:0 6px 20px rgba(0,0,0,0.08);
        }

        h1{
            color:#1e3a8a;
        }

        textarea{
            width:100%;
            height:180px;
            padding:15px;
            border-radius:12px;
            border:1px solid #d1d5db;
        }

        button{
            padding:14px 24px;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            cursor:pointer;
            margin-top:15px;
            font-weight:600;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th{
            background:#1e40af;
            color:white;
            padding:14px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #e5e7eb;
        }

        tr:hover{
            background:#f9fafb;
        }

        .qty-input{
            width:100px;
            padding:10px;
            border-radius:10px;
            border:1px solid #d1d5db;
        }

        .filter-box{
            width:100%;
            padding:14px;
            border-radius:12px;
            border:1px solid #d1d5db;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Demand Planning Calculator</h1>

        <form action="/bulk_search" method="POST">

            <textarea
                name="sku_list"
                placeholder="Enter SKUs line by line"
            ></textarea>

            <button type="submit">

                Search SKUs

            </button>

        </form>

    </div>

    <div class="card">

        <h2>Manual SKU Entry</h2>

        <form action="/add_manual" method="POST">

            <input
                type="text" 
                name="manual_sku"
                placeholder="SKU"
                required
            >

            <input
                type="number"
                name="manual_qty"
                placeholder="Qty"
                required
            >

            <button type="submit">

                Add Manual SKU

            </button>

        </form>

    </div>

    {% if results %}

    <div class="card">

        <input
            type="text"
            id="tableSearch"
            class="filter-box"
            placeholder="Filter SKU or Item Name..."
        >

        <form action="/save_dispatch" method="POST">

            <table>

                <thead>

                    <tr>

                        <th>SKU</th>
                        <th>Item Name</th>
                        <th>Inventory</th>
                        <th>ABC</th>
                        <th>Suggested Qty</th>
                        <th>Final Qty</th>

                    </tr>

                </thead>

                <tbody>

                    {% for row in results %}

                    <tr>

                        <td>

                            {{ row["SKU"] }}

                            <input
                                type="hidden"
                                name="sku"
                                value="{{ row['SKU'] }}"
                            >

                        </td>

                        <td>

                            {{ row["Item_Name"] }}

                        </td>

                        <td>

                            {{ row["Inventory"] }}

                        </td>

                        <td>

                            {{ row["ABC"] }}

                        </td>

                        <td>

                            {{ row["Stock_Required"] }}

                        </td>

                        <td>

                            <input
                                type="number"
                                name="final_qty"
                                class="qty-input"
                            >

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

            <button type="submit">

                Download Final CSV

            </button>

        </form>

    </div>

    {% endif %}

</div>

<script>

const searchInput =
    document.getElementById("tableSearch");

if(searchInput){

    searchInput.addEventListener(
        "keyup",
        function(){

            let filter =
                this.value.toLowerCase();

            let rows =
                document.querySelectorAll(
                    "tbody tr"
                );

            rows.forEach(function(row){

                let text =
                    row.innerText.toLowerCase();

                if(text.includes(filter)){

                    row.style.display = "";

                }else{

                    row.style.display = "none";

                }

            });

        }
    );

}

</script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const qtyInputs =
            document.querySelectorAll(
                ".qty-input"
            );

        qtyInputs.forEach(
            (input, index) => {

                input.addEventListener(
                    "keydown",
                    function(e){

                        if(e.key === "Enter"){

                            e.preventDefault();

                            let nextInput =
                                qtyInputs[index + 1];

                            if(nextInput){

                                nextInput.focus();

                            }

                        }

                    }
                );

            }
        );

    }
);

</script>

</body>

</html>
